<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>LLM Quota — dashboard ambient loop</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      body { margin: 0; background: #05060b; }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      .clip { position: absolute; inset: 0; }
      #dash-frame {
        position: absolute;
        inset: 0;
        background: #05060b;
      }
      #dash-img {
        display: block;
        width: 1920px;
        height: 1080px;
        transform-origin: 32% 42%;
      }
      /* Travelling soft highlight over the cards */
      #glow {
        position: absolute;
        top: 220px;
        left: 0;
        width: 620px;
        height: 620px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(91, 140, 255, 0.16) 0%, rgba(155, 91, 255, 0.07) 42%, rgba(0, 0, 0, 0) 70%);
        opacity: 0;
        pointer-events: none;
      }
      /* Thin light sweep along the reset horizon */
      #hz-sweep {
        position: absolute;
        top: 100px;
        left: 0;
        width: 480px;
        height: 3px;
        border-radius: 2px;
        background: linear-gradient(90deg, rgba(0,0,0,0) 0%, rgba(125, 170, 255, 0.55) 50%, rgba(0,0,0,0) 100%);
        filter: blur(1px);
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="dashboard-loop"
      data-width="1920"
      data-height="1080"
      data-duration="6"
      data-start="0"
    >
      <section id="scene" class="clip" data-start="0" data-duration="6" data-track-index="1">
        <div id="dash-frame">
          <img id="dash-img" src="assets/dashboard.png" alt="" />
        </div>
        <div id="hz-sweep"></div>
        <div id="glow"></div>
      </section>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Slow push-in, origin over the reset horizon / first card row.
      tl.fromTo("#dash-img",
        { scale: 1.0, x: 0, y: 0 },
        { scale: 1.045, x: -18, y: -10, duration: 6, ease: "sine.inOut" }, 0);

      // Light sweep along the horizon, left to right, fading in and out.
      tl.fromTo("#hz-sweep", { x: -480, opacity: 0 }, { x: 0, opacity: 1, duration: 0.9, ease: "sine.in" }, 0.4);
      tl.to("#hz-sweep", { x: 1920, opacity: 1, duration: 3.6, ease: "none" }, 1.3);
      tl.to("#hz-sweep", { x: 2400, opacity: 0, duration: 0.9, ease: "sine.out" }, 4.9);

      // Soft glow drifting across the card grid.
      tl.fromTo("#glow", { x: -620, opacity: 0 }, { x: -200, opacity: 1, duration: 1.2, ease: "sine.inOut" }, 1.0);
      tl.to("#glow", { x: 1500, duration: 2.8, ease: "sine.inOut" }, 2.2);
      tl.to("#glow", { x: 1920, opacity: 0, duration: 1.0, ease: "sine.inOut" }, 5.0);

      window.__timelines["dashboard-loop"] = tl;
    </script>
  </body>
</html>
