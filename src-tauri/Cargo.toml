[package]
name = "llm-quota-desktop"
version = "0.5.0"
description = "Local-first live quota dashboard for Claude Code, Codex and Gemini"
authors = ["Alessandro Boni"]
license = "MIT"
repository = "https://github.com/SandroHub013/llm-quota"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "llm_quota_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
# The operating system's own TLS rather than a bundled rustls: the update check is the
# one request this app makes to anything but loopback, and a machine behind a corporate
# proxy has already told its OS which certificates to trust. It also drops `ring`, and
# with it a C toolchain from the build.
tauri-plugin-updater = { version = "2.10.1", default-features = false, features = ["native-tls"] }
tauri-plugin-dialog = "2.7.2"
serde_json = "1.0.151"
tauri-plugin-opener = "2.5.4"

# The bundle is what users download over a metered connection, and the Bun sidecar
# already contributes ~100 MB of it. Optimise the shell for size rather than speed:
# it spawns a process, polls a port and shows a window.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
