name: New provider
description: Request support for another AI subscription
labels: [provider, enhancement]
body:
  - type: input
    id: name
    attributes:
      label: Provider name
      placeholder: "e.g. Mistral, Groq, DeepSeek"
    validations:
      required: true

  - type: input
    id: endpoint
    attributes:
      label: Usage / quota endpoint
      description: The API endpoint that reports remaining quota, if you know it.

  - type: textarea
    id: auth
    attributes:
      label: How authentication works
      description: >
        API key, OAuth, or a token an official CLI already writes to disk?
        If a CLI stores it, where?
    validations:
      required: true

  - type: checkboxes
    id: help
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a PR for this adapter
