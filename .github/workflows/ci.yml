name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only by default. No job here publishes anything, and a workflow with no
# permissions block inherits whatever the repository default is — which is a write
# token on many repositories, handed to third-party actions for no reason.
permissions:
  contents: read

# Actions are pinned to commit SHAs rather than tags throughout. A tag is mutable:
# whoever controls the action repository can repoint v7 at different code, and it
# runs here with this repository's token. Dependabot updates the pins; the trailing
# comment is what keeps them readable.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Lint
        run: bun run lint

  # Dependency advisories, kept out of the test job so a newly published advisory
  # reports on its own instead of turning the test run red.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      # bun.lock is not a format `npm audit` reads, so resolve the same manifest
      # into a lockfile npm understands and audit that.
      - name: npm audit (production dependencies)
        run: |
          npm install --package-lock-only --omit=dev
          npm audit --omit=dev --audit-level=moderate

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: pip-audit (developer tooling)
        run: |
          python -m pip install --quiet pip-audit
          pip-audit -r requirements-dev.txt

  # The desktop shell is Rust, so `bun test` cannot see it break. This compiles the
  # shell against the real sidecar, which is what a change to either side breaks, and
  # it is the fast half: the `install` job below is the one that bundles and installs.
  desktop:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'

      - run: bun install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: './src-tauri -> target'

      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            file

      - name: Compile the server sidecar
        run: bun run sidecar -- x86_64-unknown-linux-gnu

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  # The failure this job exists for: an installer that reports success and installs
  # nothing. The NSIS build this project shipped first did exactly that — no program
  # folder, no registry entry, no shortcut, exit code zero — and nothing in CI could
  # have caught it, because nothing in CI had ever run an installer. Compiling the
  # shell is not the same as installing it.
  #
  # So each platform builds its own bundle, installs it the way a user would, and then
  # proves the payload is really on disk and really runs: the installed server is
  # started from its installed path and has to answer on the port. The window is not
  # opened — a webview on a headless runner tests the runner, not this project — but
  # the shell and the sidecar are both asserted present, and a missing file is the
  # symptom every installer failure so far has shown.
  install:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, bundle: msi }
          - { os: macos-latest, target: aarch64-apple-darwin, bundle: dmg }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, bundle: deb }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'

      - run: bun install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: './src-tauri -> target'
          key: install-${{ matrix.target }}

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            file

      # Must precede the bundler: Tauri resolves externalBin at bundle time and fails
      # outright when the target-suffixed file is absent.
      - name: Compile the server sidecar
        run: bun run sidecar -- ${{ matrix.target }}

      # The overlay turns off updater artifacts, which the bundler refuses to produce
      # without the signing key. Handing that key to a job that runs on every pull
      # request — including one opened from a fork, where secrets are absent and the
      # build would fail anyway — buys nothing: what this job checks is that the
      # installer installs. The release workflow is where signing belongs.
      - name: Bundle
        run: >
          bun x @tauri-apps/cli build --target ${{ matrix.target }}
          --bundles ${{ matrix.bundle }}
          --config src-tauri/tauri.ci.conf.json

      - name: Install and verify (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msi = Get-ChildItem "src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi" | Select-Object -First 1
          if (-not $msi) { throw "the bundler produced no .msi" }

          $installer = Start-Process msiexec.exe -Wait -PassThru -ArgumentList `
            "/i", "`"$($msi.FullName)`"", "/qn", "/L*v", "msi.log"
          if ($installer.ExitCode -ne 0) {
            Get-Content msi.log -Tail 40
            throw "msiexec exited $($installer.ExitCode)"
          }

          # The point of the job. msiexec reporting success is not evidence of a file.
          $dir = "C:\Program Files\LLM Quota"
          foreach ($name in "llm-quota-desktop.exe", "llm-quota-server.exe") {
            if (-not (Test-Path "$dir\$name")) { throw "$name is missing from $dir" }
          }
          $entry = Get-ItemProperty "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*" |
            Where-Object DisplayName -eq "LLM Quota"
          if (-not $entry) { throw "no Add/Remove Programs entry" }

          $env:PORT = "4747"
          $server = Start-Process "$dir\llm-quota-server.exe" -PassThru
          try {
            $answered = $false
            foreach ($attempt in 1..30) {
              try {
                if ((Invoke-WebRequest "http://127.0.0.1:4747/" -UseBasicParsing -TimeoutSec 2).StatusCode -eq 200) {
                  $answered = $true
                  break
                }
              } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $answered) { throw "the installed server never answered on 4747" }
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }

          # The upgrade path, which is not the same code as the first install and has
          # its own way of going wrong: Tauri regenerates the ProductCode on every
          # build, so only a stable UpgradeCode makes a second install replace the
          # first. If that ever breaks, the user is left with two entries and two
          # copies rather than an upgraded one.
          $upgrade = Start-Process msiexec.exe -Wait -PassThru -ArgumentList `
            "/i", "`"$($msi.FullName)`"", "/qn", "/L*v", "upgrade.log"
          if ($upgrade.ExitCode -ne 0) {
            Get-Content upgrade.log -Tail 40
            throw "installing over the first install exited $($upgrade.ExitCode)"
          }
          $entries = @(Get-ItemProperty "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*" |
            Where-Object DisplayName -eq "LLM Quota")
          if ($entries.Count -ne 1) { throw "$($entries.Count) Add/Remove Programs entries, expected 1" }

          # And uninstalling has to take the files with it.
          Start-Process msiexec.exe -Wait -ArgumentList "/x", "`"$($msi.FullName)`"", "/qn"
          if (Test-Path "$dir\llm-quota-desktop.exe") { throw "uninstalling left the shell behind" }

      - name: Install and verify (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          dmg=$(ls src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg | head -1)

          # The bundle carries a licenseFile, so the image asks for the agreement
          # before it will mount. A user clicks Agree; a script that says nothing gets
          # "hdiutil: attach canceled" after the licence text scrolls past. A here
          # string rather than `yes |`, because the pipe outlives the reader: hdiutil
          # stops reading once it has its answer, `yes` takes SIGPIPE, and pipefail
          # then fails a step whose disk is already mounted.
          #
          # An explicit mountpoint, because the volume name contains a space and
          # parsing it back out of hdiutil's output does not survive that.
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint /tmp/llm-quota-dmg <<< "Y"
          cp -R "/tmp/llm-quota-dmg/LLM Quota.app" /Applications/
          hdiutil detach /tmp/llm-quota-dmg

          app="/Applications/LLM Quota.app/Contents/MacOS"
          test -x "$app/llm-quota-desktop" || { echo "the shell is missing from the app bundle"; exit 1; }
          test -x "$app/llm-quota-server" || { echo "the sidecar is missing from the app bundle"; exit 1; }

          PORT=4747 "$app/llm-quota-server" &
          server=$!
          trap 'kill $server 2>/dev/null || true' EXIT
          for _ in $(seq 30); do
            curl -fsS http://127.0.0.1:4747/ > /dev/null && exit 0
            sleep 1
          done
          echo "the installed server never answered on 4747"
          exit 1

      - name: Install and verify (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          deb=$(ls src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb | head -1)
          # An absolute path, or apt reads the argument as the name of a package to
          # fetch from the archive rather than as a file to install.
          sudo apt-get install -y "$PWD/$deb"

          package=$(dpkg-deb -f "$deb" Package)
          files=$(dpkg -L "$package")
          echo "$files" | grep -q '/llm-quota-desktop$' || { echo "the shell is not in the package"; exit 1; }
          server=$(echo "$files" | grep '/llm-quota-server$' | head -1)
          test -x "$server" || { echo "the sidecar is not in the package"; exit 1; }

          PORT=4747 "$server" &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT

          answered=
          for _ in $(seq 30); do
            if curl -fsS http://127.0.0.1:4747/ > /dev/null; then answered=yes; break; fi
            sleep 1
          done
          if [ -z "$answered" ]; then
            echo "the installed server never answered on 4747"
            exit 1
          fi
          kill "$pid" 2>/dev/null || true

          # A package that installs cleanly and then leaves its files behind on removal
          # is its own bug report.
          sudo apt-get remove -y "$package"
          if [ -e "$server" ]; then
            echo "removing the package left $server behind"
            exit 1
          fi

  # The widget is Tk, and Tk is where a cross-platform promise quietly stops being
  # true: an import of winreg, a -transparentcolor attribute or a creationflags
  # argument costs nothing on Windows and refuses to start everywhere else. Running
  # its tests on all three is what keeps that honest. Bun runs here too, so the
  # Windows-only PowerShell/status-line bridge path is exercised rather than skipped.
  widget:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: TypeScript tests
        run: bun test

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      # Tk is a separate package on Debian and Ubuntu, and importing the widget is the
      # first thing every one of its tests does. desktop-file-utils carries
      # update-desktop-database, and xdg-utils carries xdg-mime, both of which the
      # registration step below is here to exercise for real.
      - name: Tk and the desktop tools for Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk desktop-file-utils xdg-utils

      - name: Widget tests
        run: python -m unittest widget_test

      # The unit tests mock the desktop tools away, because the case worth pinning
      # there is the machine that does not have them. This is the other half, and the
      # commoner one: run the registration for real and ask the desktop what it would
      # actually open. The bug this replaces reported a handler it had not registered,
      # and clicking Widget in the dashboard opened "No apps available".
      #
      # No session bus is needed. xdg-mime writes and reads mimeapps.list, which is a
      # file, so this holds on a headless runner.
      - name: The dashboard's Widget button has something to open
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          python widget.py --register-protocol

          entry="$HOME/.local/share/applications/llm-quota-widget.desktop"
          desktop-file-validate "$entry"

          handler=$(xdg-mime query default x-scheme-handler/llmquota)
          if [ "$handler" != "llm-quota-widget.desktop" ]; then
            echo "the scheme resolves to '${handler:-nothing}', not the widget"
            exit 1
          fi
