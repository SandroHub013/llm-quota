name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Lint
        run: bun run lint

  # Dependency advisories, kept out of the test job so a newly published advisory
  # reports on its own instead of turning the test run red.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # bun.lock is not a format `npm audit` reads, so resolve the same manifest
      # into a lockfile npm understands and audit that.
      - name: npm audit (production dependencies)
        run: |
          npm install --package-lock-only --omit=dev
          npm audit --omit=dev --audit-level=moderate

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: pip-audit (developer tooling)
        run: |
          python -m pip install --quiet pip-audit
          pip-audit -r requirements-dev.txt

  # The desktop shell is Rust, so `bun test` cannot see it break. This does not bundle
  # installers — that is the release workflow's job, and it takes minutes. It compiles
  # the shell against the real sidecar, which is what a change to either side breaks.
  desktop:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - run: bun install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            file

      - name: Compile the server sidecar
        run: bun run sidecar -- x86_64-unknown-linux-gnu

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  # CONTRIBUTING asks contributors to run these; run Bun here too so the Windows-only
  # PowerShell/status-line bridge path is exercised instead of being skipped on Ubuntu.
  widget:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: TypeScript tests
        run: bun test

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Widget tests
        run: python -m unittest widget_test
