name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

  # CONTRIBUTING asks contributors to run these; nothing was checking that they pass.
  # Its own job on Windows: widget.py imports winreg to register the llmquota://
  # protocol, so the module does not even load on a Linux runner.
  widget:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Widget tests
        run: python -m unittest widget_test
