name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

  # CONTRIBUTING asks contributors to run these; run Bun here too so the Windows-only
  # PowerShell/status-line bridge path is exercised instead of being skipped on Ubuntu.
  widget:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: TypeScript tests
        run: bun test

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Widget tests
        run: python -m unittest widget_test
