name: Release

# Tag a commit on main and the installers build themselves:
#
#   git tag v0.4.0 && git push origin v0.4.0
#
# The release is created as a draft. Someone still reads the notes and presses
# publish — the tag is the trigger, not the decision.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and attach the bundles to (e.g. v0.4.0)'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # The tag is the last point where a red suite is cheap to fix. Every bundle job
  # waits on this one, so a broken build never reaches a draft release.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Lint
        run: bun run lint

  bundle:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 rather than latest on purpose: the AppImage and .deb link against the
          # glibc of the runner that built them, so building on the newest Ubuntu makes
          # a package that refuses to start on any older distribution.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, label: linux-x64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, label: windows-x64 }
          - { os: macos-latest, target: aarch64-apple-darwin, label: macos-arm64 }
          - { os: macos-latest, target: x86_64-apple-darwin, label: macos-x64 }

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'

      - run: bun install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      # Keyed on the target so the four jobs do not evict each other's cache.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.target }}

      # Tauri v2 wants webkit2gtk 4.1; 4.0 is the v1 dependency and does not satisfy it.
      # libayatana-appindicator is what carries the tray icon on GNOME.
      - name: Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            file

      # Must precede the bundler: Tauri resolves the externalBin entry at bundle time
      # and fails the build outright when the target-suffixed file is absent.
      - name: Compile the server sidecar
        run: bun run sidecar -- ${{ matrix.target }}

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: ${{ inputs.tag || github.ref_name }}
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

      # The bare server, for anyone who wants the dashboard without the desktop shell:
      # one executable, no Bun, no clone, `PORT=4747 ./llm-quota-server`. It is the same
      # binary the bundle embeds, so it costs nothing extra to publish.
      - name: Attach the standalone server
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          suffix=""
          [[ "${{ matrix.target }}" == *windows* ]] && suffix=".exe"
          source="src-tauri/binaries/llm-quota-server-${{ matrix.target }}${suffix}"
          asset="llm-quota-server-${{ matrix.label }}${suffix}"
          cp "$source" "$asset"
          gh release upload "$tag" "$asset" --clobber --repo "${{ github.repository }}"
