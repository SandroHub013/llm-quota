version: 2

updates:
  # bun, not npm — one runtime dependency (hono) and the TypeScript toolchain.
  #
  # The npm ecosystem reads package.json but leaves bun.lock untouched, so every PR
  # it opened here died on `bun install --frozen-lockfile` before running a single
  # test. The bun ecosystem maintains the text-based bun.lock this project commits.
  # It covers version updates only; security updates still come from the audit job.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Packages that peer-depend on each other have to move in one commit, majors
      # included. Split apart, neither PR can pass: @eslint/js@10 peers on eslint@^10,
      # so the @eslint/js-only PR died in `npm install` with ERESOLVE against the
      # eslint 9 still pinned beside it.
      eslint:
        patterns:
          - eslint
          - '@eslint/*'
          - typescript-eslint
        update-types:
          - major
          - minor
          - patch
      # Minor and patch bumps land as one reviewable PR per week; a major stays on
      # its own, because that is the one that needs a human to read the changelog.
      minor-and-patch:
        update-types:
          - minor
          - patch

  # pip — requirements-dev.txt: the preview-capture tooling only.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # The workflows pin actions by major tag; this keeps those pins current too.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
    commit-message:
      prefix: ci
    groups:
      actions:
        update-types:
          - minor
          - patch
